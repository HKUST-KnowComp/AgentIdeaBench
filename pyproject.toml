[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "scisynthbench"
version = "0.1.0"
description = "A dynamic multi-domain benchmark for scientific idea generation"
requires-python = ">=3.9"
dependencies = [
    "openai==1.82.0",
    "requests==2.32.3",
    "python-dotenv==1.1.0",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["scisynthbench*"]

[project.scripts]
scisynthbench = "scisynthbench.run:main"
