# Publishes site/ to GitHub Pages.
#
# This is a mirror, not the primary deployment. The leaderboard is served from
# https://moyunxiang.com/agentideabench/, which is where the README and the page's own
# canonical link point. Enabling Pages here is optional and changes nothing
# about that URL.
#
# One-time setup, in the repository's Settings -> Pages: set Source to
# "GitHub Actions". The repository must be public, or the organization must be
# on a plan that allows Pages for private repositories; otherwise the deploy
# step fails with a 404 on the Pages API.
#
# site/index.html is a build product of reports/_build_leaderboard_page.py and
# is committed, so this workflow only uploads. It does not run python and does
# not need the databases, which never ship.
name: Deploy leaderboard

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
